name: Spawn SeaRM App Dev Test
description: >
  Starts a SeaRM all-in-one test instance (server, worker, database, redis)
  using the searmcrm/searm-app-dev Docker image on port 2021.
  The server is available at http://localhost:2021 with seeded demo data.

inputs:
  searm-version:
    description: 'SeaRM Docker Hub image tag for searm-app-dev (e.g., "latest" or "v1.20.0").'
    required: false
    default: 'latest'

outputs:
  server-url:
    description: 'URL where the SeaRM test server can be reached'
    value: http://localhost:2021
  api-key:
    description: 'API key (type: API_KEY) for the seeded SeaRM dev workspace'
    value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyMDIwMjAyMC0xYzI1LTRkMDItYmYyNS02YWVjY2Y3ZWE0MTkiLCJ0eXBlIjoiQVBJX0tFWSIsIndvcmtzcGFjZUlkIjoiMjAyMDIwMjAtMWMyNS00ZDAyLWJmMjUtNmFlY2NmN2VhNDE5IiwiaWF0IjoxNzM1Njg5NjAwLCJleHAiOjQ4OTE0NDk2MDAsImp0aSI6IjIwMjAyMDIwLWY0MDEtNGQ4YS1hNzMxLTY0ZDAwN2MyN2JhZCJ9.bfQjfyN0NEtTCLE_xPyNcwonDzlSXFoP8kdCQTdnuDc

runs:
  using: 'composite'
  steps:
    - name: Start searm-app-dev-test container
      shell: bash
      run: |
        docker run -d \
          --name searm-app-dev-test \
          -p 2021:2021 \
          -e NODE_PORT=2021 \
          -e SERVER_URL=http://localhost:2021 \
          -e MARKETPLACE_CATALOG_SYNC_CRON_ENABLED=false \
          -e API_RATE_LIMITING_SHORT_LIMIT=100000 \
          -e API_RATE_LIMITING_LONG_LIMIT=100000 \
          searmcrm/searm-app-dev:${{ inputs.searm-version }}

        echo "Waiting for SeaRM test instance to become healthy…"
        TIMEOUT=180
        ELAPSED=0
        until curl -sf http://localhost:2021/healthz > /dev/null 2>&1; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "::error::SeaRM did not become healthy within ${TIMEOUT}s"
            docker logs searm-app-dev-test 2>&1 | tail -80
            exit 1
          fi
          sleep 3
          ELAPSED=$((ELAPSED + 3))
          echo "  … waited ${ELAPSED}s"
        done
        echo "SeaRM test instance is ready at http://localhost:2021 (took ~${ELAPSED}s)"
