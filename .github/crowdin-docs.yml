#
# Crowdin CLI configuration for Documentation translations
# See https://crowdin.github.io/crowdin-cli/configuration for more information
#

"project_id": 2
"preserve_hierarchy": true
"base_url": "https://searm.api.crowdin.com"
"base_path": ".."

files: [
  {
    "source": "packages/searm-docs/getting-started/**/*.mdx",
    "translation": "packages/searm-docs/l/%two_letters_code%/getting-started/**/%original_file_name%",
    "type": "mdx_v2",
    "exclude_code_blocks": true,
    "excluded_front_matter_elements": ["icon"],
  },
  {
    "source": "packages/searm-docs/user-guide/**/*.mdx",
    "translation": "packages/searm-docs/l/%two_letters_code%/user-guide/**/%original_file_name%",
    "type": "mdx_v2",
    "exclude_code_blocks": true,
    "excluded_front_matter_elements": ["icon"],
  },
  {
    "source": "packages/searm-docs/developers/**/*.mdx",
    "translation": "packages/searm-docs/l/%two_letters_code%/developers/**/%original_file_name%",
    "type": "mdx_v2",
    "exclude_code_blocks": true,
    "excluded_front_matter_elements": ["icon"],
  },
  {
    #
    # Navigation labels template - translated into per-locale navigation.json
    #
    "source": "packages/searm-docs/navigation/navigation.template.json",
    "translation": "packages/searm-docs/l/%two_letters_code%/navigation.json",
  }
]
